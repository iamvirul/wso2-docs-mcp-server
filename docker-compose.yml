version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: choreodocs-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: choreomcp
      POSTGRES_PASSWORD: choreomcp
      POSTGRES_DB: choreodocs
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choreomcp -d choreodocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: choreodocs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@choreomcp.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgvector_data:
