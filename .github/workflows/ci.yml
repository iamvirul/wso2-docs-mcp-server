name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify dist entry exists
        run: test -f dist/src/index.js

  smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wso2mcp
          POSTGRES_PASSWORD: wso2mcp
          POSTGRES_DB: wso2docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wso2mcp -d wso2docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wso2mcp:wso2mcp@localhost:5432/wso2docs
      # Nothing listens here, so the default provider takes the zero-config
      # HuggingFace ONNX fallback path that most users hit.
      OLLAMA_BASE_URL: http://127.0.0.1:9

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      # Install the tarball the way users do (fresh resolution, no lockfile)
      # so broken ESM output or missing published files fail here.
      - name: Install packed tarball into a clean project
        run: |
          echo "CONSUMER_DIR=$RUNNER_TEMP/consumer" >> "$GITHUB_ENV"
          CONSUMER_DIR="$RUNNER_TEMP/consumer"
          mkdir -p "$CONSUMER_DIR"
          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/wso2-docs-mcp-server-*.tgz

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ${{ env.CONSUMER_DIR }}/node_modules/@huggingface/transformers/.cache
          key: hf-model-Xenova-nomic-embed-text-v1-q8

      - name: Run migrations (twice, to verify idempotency)
        run: |
          "$CONSUMER_DIR/node_modules/.bin/wso2-docs-migrate"
          "$CONSUMER_DIR/node_modules/.bin/wso2-docs-migrate"

      - name: Crawl CLI loads
        run: '"$CONSUMER_DIR/node_modules/.bin/wso2-docs-crawl" --help'

      - name: MCP end-to-end smoke test
        run: npm run test:smoke
        env:
          SMOKE_PACKAGE_DIR: ${{ env.CONSUMER_DIR }}/node_modules/wso2-docs-mcp-server
          SMOKE_BIN_DIR: ${{ env.CONSUMER_DIR }}/node_modules/.bin
